syntax = "proto3";

package registry.proto.group;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "peer/peer.proto";

option go_package = "github.com/uddinArsalan/ferry-proto/group";

service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (GroupID); // create group

  rpc GetGroupsForPeer(registry.proto.peer.GetPeerRequest) returns (Groups); // get groups of peer

  rpc GetGroups(google.protobuf.Empty) returns (Groups); // get groups of user

  rpc GetGroup(GetGroupRequest) returns (Group);

  rpc CreateGroupPeerMembership(CreateGroupPeerMembershipRequest) returns (google.protobuf.Empty);

  rpc GetGroupPeerMembership(GetGroupPeerMembershipRequest) returns (GetGroupPeerMembershipResponse);

  rpc GetJoinRequest(GetJoinReq) returns (GetJoinRequestResponse);
  rpc CreateJoinRequest(CreateJoin) returns (google.protobuf.Empty); // create join req (invite/join)
  rpc UpdateJoinRequestStatus(UpdateJoin) returns (google.protobuf.Empty); // update join req (invite/join) status

  // Invitations received by a peer
  rpc GetAllPendingInvites(GetAllPendingRequest) returns (PendingInviteResponse);

  // Invitations recieved by a peer for a group (at most 1, since only owner is allowed to do one pending at a time)
  rpc GetGroupPendingInvite(GetGroupPendingRequest) returns (GetInviteRequestResponse);

  // Join requests received by the owner
  rpc GetAllPendingJoinRequestsForOwner(GetAllPendingRequest) returns (PendingJoinResponse);

  // Join requests received by the owner for a particular group
  rpc GetGroupPendingJoinRequestsForOwner(GetGroupPendingRequest) returns (PendingJoinResponse);

  // Join requests sent by a peer
  rpc GetAllPendingJoinRequestsBySender(GetAllPendingRequest) returns (PendingJoinResponse);

  // Join requests sent by the peer for a particular group
  rpc GetGroupPendingJoinRequestsBySender(GetGroupPendingRequest) returns (GetJoinRequestResponse);

  // get group -> owner peer id
  rpc GetGroupOwnerPeerID(GetGroupRequest) returns (registry.proto.peer.GetPeerResponse);

  rpc GetPeerSyncSnapshot(registry.proto.peer.GetPeerRequest) returns (SnapshotResponse);
}

message SnapshotResponse {
  string peer_id = 1;
  repeated GroupWithPeers groups = 2;
}

message GroupWithPeers {
  int64 id = 1;
  string group_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  repeated registry.proto.peer.Peer peer = 5;
}

message CreateGroupRequest {
  string group_id = 1;
  string name = 2;
}

enum JoinType {
  INVITE = 0;
  JOIN_REQUEST = 1;
}

enum INVITE_STATUS {
  PENDING = 0;
  ACCEPTED = 1;
  REJECTED = 2;
  CANCELLED = 3;
}

message GetJoinReq {
  int64 request_id = 1;
}

message GetJoinResponse {
  int64 request_id = 1;
  string group_id = 2;
  JoinType type = 3;
  string sender_peer_id = 4;
  string recipient_peer_id = 5;
  INVITE_STATUS status = 6;
}

message CreateJoin {
  string group_id = 1;
  JoinType type = 2;
  string sender_peer_id = 3;
  string recipient_peer_id = 4;
  INVITE_STATUS status = 5;
}

message UpdateJoin {
  int64 request_id = 1;
  INVITE_STATUS status = 2;
}

message GetAllPendingRequest {
  string peer_id = 1;
}

message GetGroupPendingRequest {
  string group_id = 1;
  string peer_id = 2;
}

message GetJoinRequestResponse {
  int64 request_id = 1;
  string group_id = 2;
  string group_name = 3;
  JoinType type = 4;
  string sender_peer_id = 5;
  string sender_peer_name = 6;
  string recipient_peer_id = 7;
  string recipient_peer_name = 8;
  INVITE_STATUS status = 9;
}

message GetInviteRequestResponse {
  int64 request_id = 1;
  string group_id = 2;
  string group_name = 3;
  JoinType type = 4;
  string sender_peer_id = 5;
  string sender_peer_name = 6;
  string recipient_peer_id = 7;
  string recipient_peer_name = 8;
  INVITE_STATUS status = 9;
}

message PendingJoinResponse {
  repeated GetJoinRequestResponse pending_join_requests = 1;
}

message PendingInviteResponse {
  repeated GetInviteRequestResponse pending_invite_requests = 1;
}

message GetGroupRequest {
  string group_id = 1;
}

enum PeerRole {
  OWNER = 0;
  ADMIN = 1;
  MEMBER = 2;
}

message CreateGroupPeerMembershipRequest {
  string group_id = 1; // represent local peer and group ids
  string peer_id = 2;
  PeerRole role = 3;
}

message GetGroupPeerMembershipRequest {
  string group_id = 1; // represent local peer and group ids
  string peer_id = 2;
}

message GetGroupPeerMembershipResponse {
  int64 peer_id = 1;
  int64 group_id = 2;
  PeerRole role = 3;
  google.protobuf.Timestamp joined_at = 4;
}

// represent db group id
message GroupID {
  int64 id = 1;
}

message Group {
  int64 id = 1;
  string group_id = 2;
  string name = 3;
  int64 user_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Groups {
  repeated Group groups = 1;
}
