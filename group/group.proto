syntax = "proto3";

package registry.proto.group;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "peer/peer.proto";

option go_package = "github.com/uddinArsalan/ferry-proto/group";

service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (GroupID); // create group

  rpc GetGroupsForPeer(registry.proto.peer.GetPeerRequest) returns (Groups); // get groups of peer

  rpc GetGroups(google.protobuf.Empty) returns (Groups); // get groups of user

  rpc GetGroup(GetGroupRequest) returns (Group);

  rpc CreatePeerMembership(CreatePeerMembershipRequest) returns (google.protobuf.Empty);
}

message CreateGroupRequest {
  string group_id = 1;
  string name = 2;
}

message GetGroupRequest {
  string group_id = 1;
}

enum PeerRole {
  OWNER = 0;
  ADMIN = 1;
  MEMBER = 2;
}

message CreatePeerMembershipRequest {
  string group_id = 1; // represent local peer and group ids
  string peer_id = 2;
  PeerRole role = 3;
}

// represent db group id
message GroupID {
  int64 id = 1;
}

message Group {
  int64 id = 1;
  string group_id = 2;
  string name = 3;
  int64 user_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Groups {
  repeated Group groups = 1;
}
